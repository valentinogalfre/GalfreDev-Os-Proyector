name: Publicar versión

# Al pushear un tag vX.Y.Z: corre los tests, arma el APK de release firmado con la clave oficial y
# publica la release con el APK. Los proyectores la ven desde «Buscar actualizaciones».
#
#   git tag v1.4.0 && git push origin v1.4.0
#
# El tag tiene que coincidir con versionName en app/build.gradle.kts.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Armar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # La huella del certificado oficial. Si la clave de los secretos no es esta, no se publica nada:
      # un APK con otra firma no se puede instalar encima de los que ya están en los proyectores.
      CERT_SHA256: c2374fcfce258f9abd5448e0f664b12d4aba74f9bffa51fccdb4ec8c8cfa646d
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: El tag coincide con la versión
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::El tag tiene que ser vX.Y.Z, con números."
            exit 1
          fi
          code=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$tag" != "$code" ]; then
            echo "::error::El tag es v$tag pero versionName es $code. Cambiá versionName, commiteá y volvé a taggear."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Tests de contrato
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar y firmar
        env:
          GDOS_KEYSTORE_BASE64: ${{ secrets.GDOS_KEYSTORE_BASE64 }}
          GDOS_KEYSTORE_PASSWORD: ${{ secrets.GDOS_KEYSTORE_PASSWORD }}
          GDOS_KEY_ALIAS: ${{ secrets.GDOS_KEY_ALIAS }}
        run: |
          if [ -z "$GDOS_KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secretos de firma (GDOS_KEYSTORE_BASE64). En un fork, cargá tu propia clave."
            exit 1
          fi
          export GDOS_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$GDOS_KEYSTORE_BASE64" | base64 -d > "$GDOS_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$GDOS_KEYSTORE"

      - name: Comprobar la firma
        id: apk
        run: |
          apk="galfredev-os-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          if [ "${{ github.repository }}" = "valentinogalfre/galfredev-OS" ] && ! grep -qi "SHA-256 digest: $CERT_SHA256" certs.txt; then
            echo "::error::El APK no está firmado con la clave oficial."
            exit 1
          fi
          echo "file=$apk" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Para actualizar: en el proyector, **Ajustes → Buscar actualizaciones**. Se instala encima y conserva apps, ajustes y la clave de Claude."
            echo
            echo "Primera vez: bajá \`${{ steps.apk.outputs.file }}\` y seguí [docs/instalar.md](https://github.com/${{ github.repository }}/blob/main/docs/instalar.md)."
            echo
            echo "SHA-256: \`${{ steps.apk.outputs.sha }}\`"
          } > notas.md
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" \
            --title "galfredev OS ${{ steps.version.outputs.version }}" \
            --notes-file notas.md --generate-notes --verify-tag
