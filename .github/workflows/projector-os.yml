name: galfredev OS (APK + emulador)

# Compila el APK, corre los tests y lint, y lo prueba en un emulador con pantalla de TV a 1080p:
# recorre las pantallas con el control remoto, saca capturas y falla si la app se cierra sola o
# si la cinta no está donde corresponde.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: galfredev-os-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Tests de contrato
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Compilar
        run: ./gradlew --no-daemon assembleDebug
      # Lo que se publica es la release, con R8: si algo se rompe al achicar el código, que salte acá
      # y no en los proyectores. Sin los secretos se firma con la clave de debug.
      - name: Compilar como release
        run: ./gradlew --no-daemon assembleRelease
      - name: Subir reportes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: galfredev-os-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    name: Probar en emulador (TV 1080p)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: galfredev-os-apk
          path: apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Recorrer la app y sacar capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-smoke.sh apk/app-debug.apk capturas
      - name: Subir capturas y log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-emulador
          path: capturas
          if-no-files-found: warn
