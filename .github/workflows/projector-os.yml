name: Projector OS (APK + emulador)

# Compila el APK de Galfré Projector OS y lo prueba en un emulador con
# pantalla de TV 1080p: recorre las pantallas con el "control remoto",
# saca capturas y falla si la app se cierra sola.
on:
  push:
    paths:
      - '**'
  workflow_dispatch:

concurrency:
  group: projector-os-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: ./gradlew --no-daemon assembleDebug
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: galfre-projector-os-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    name: Probar en emulador (TV 1080p)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: galfre-projector-os-apk
          path: apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Recorrer la app y sacar capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-smoke.sh apk/app-debug.apk capturas
      - name: Subir capturas y log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-emulador
          path: capturas
          if-no-files-found: warn
